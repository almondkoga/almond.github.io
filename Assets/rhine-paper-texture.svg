<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f3f1"/>
      <stop offset="1" stop-color="#eeedeb"/>
    </linearGradient>
    <pattern id="halftone" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".55" fill="#67635f" opacity=".20"/>
    </pattern>
    <pattern id="diagonal" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V7" stroke="#77736f" stroke-width=".35" opacity=".10"/>
    </pattern>
  </defs>
  <rect width="320" height="320" fill="url(#paper)"/>
  <rect width="320" height="320" fill="url(#diagonal)"/>
  <rect width="320" height="320" fill="url(#halftone)" opacity=".48"/>
</svg>
